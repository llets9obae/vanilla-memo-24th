<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla Memo</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <header class="top-bar">
    <div class="search-container">
      <div class="tag-filter-wrapper">
        <button type="button" class="tag-badge" id="tagFilterBtn">
          <span class="tag-dot" id="tagDot"></span>
          <span id="selectedTagText">태그 선택</span>
          <svg class="arrow-icon" width="16" height="13" viewBox="0 0 8 10" fill="currentColor">
            <polygon points="0,0 8,5 0,10" />
          </svg>
        </button>
        <ul class="tag-dropdown" id="tagDropdown" aria-label="태그 필터">
          <li data-tag="all">전체</li>
          <li data-tag="Daily"><span class="dot-sample dot-daily"></span>Daily</li>
          <li data-tag="Work"><span class="dot-sample dot-work"></span>Work</li>
          <li data-tag="Others"><span class="dot-sample dot-others"></span>Others</li>
        </ul>
      </div>
      <input class="search-input" type="text" placeholder="원하는 메모를 검색하세요" aria-label="메모 검색" />
      <button type="button" class="search-submit-btn" aria-label="검색">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
      </button>
    </div>
    <button type="button" class="icon-btn add-btn" aria-label="메모 추가">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button type="button" class="icon-btn" aria-label="내 계정">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8V21h19.2v-1.8c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </button>
  </header>

  <main class="memo-container">
    <section class="memo-section">
      <div class="card-grid" id="memoGrid"></div>
      <div class="empty-area">
        <div class="center-add-btn" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <p class="empty-memo-text">새로운 메모를 작성해보세요!</p>
      </div>
      <div class="empty-area search-empty-area" id="searchEmptyArea" hidden>
        <div class="search-empty-icon" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
          </svg>
        </div>
        <div class="empty-text-box">
          <p class="empty-title">검색 결과가 없습니다</p>
          <p class="empty-sub">다른 검색어로 다시 시도해 보세요.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="memoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <article class="modal-card" id="modalCard">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-meta">
        <span class="modal-tag-chip"><span class="modal-tag-dot" id="modalTagDot"></span><span id="modalTag"></span></span>
        <span class="modal-divider" aria-hidden="true"></span>
        <time class="modal-date" id="modalDate"></time>
      </div>
      <p class="modal-body" id="modalBody"></p>
      <div class="modal-actions">
        <button type="button" class="modal-action-btn" aria-label="메모 수정">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </button>
        <button type="button" class="modal-action-btn" aria-label="메모 삭제">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 11v5M14 11v5"></path>
          </svg>
        </button>
      </div>
    </article>
  </div>

  <script src="./js/memo.js"></script>
</body>
</html>
